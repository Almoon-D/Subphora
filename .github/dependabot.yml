# Dependabot, tuned for GitHub Free: the binding budget is a private repository's, and a
# public one loses nothing by it.
#
# Dependabot's own jobs are free, but every pull request it opens runs CI, which is not.
# So: one batch a month, every non-major update in one pull request per ecosystem, and a
# week of cooldown so a release that is replaced within days never reaches us. CI merges
# those batches by itself once green (.github/workflows/ci.yml → dependabot-merge), so they
# are open for minutes and seldom need a rebase. Majors arrive one by one and wait for the
# monthly maintenance session (docs/sessions/maintenance.md), because each needs reading.
# Security updates are not on this schedule: GitHub opens them as soon as an advisory lands
# (Settings → Advanced Security → Dependabot security updates).
#
# A project that adds another language or a Dockerfile adds its ecosystem here, with the
# same schedule, cooldown and grouping.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    # A deliberate upper bound in pyproject.toml gets an `ignore` here with the reason, so
    # Dependabot does not reopen the same pull request every month. Example:
    # ignore:
    #   - dependency-name: cryptography
    #     versions: [">=51"]   # 51 drops finite-field DH, which the broker's handshake needs

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The front end (web/, decision 0016). `typescript` stays on 6.0 for typescript-eslint
  # while `typescript-7` (an alias) is the compiler: bump the parser only when
  # typescript-eslint supports TypeScript 7.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      web-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]

  # The deployment's images (deploy/*.Dockerfile, deploy/compose.yaml; decision 0039): base
  # images are dependencies too. CI does not build them, so a bump is checked by rebuilding
  # on the owner's computer (deploy/GUIA.md → "Actualizar").
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]
    # Python's image follows .python-version (3.15 → 3.16 is a new Python, which Docker tags
    # make look like a minor update): the maintenance session moves both together.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
