      params: {service: WFS, version: 2.0.0, request: GetFeature, STOREDQUERY_ID: GetParcel, refcat: 7279701NH3477G, srsname: "EPSG::25830"}
      expect_content_type: text/xml
      expect_text: "7279701NH3477G"

