# Copyright (c) 2026 Almoon-D. All rights reserved.
# The source catalogue: the only hosts the HTTP client may call (hard rule 4). Every entry
# was observed live on 2026-11-24; its behaviour, terms and evidence are in the knowledge
# file it names. `uv run subphora sources check` re-checks the facts recorded here
# (layers offered, EPSG:3857, CORS, one small sample) and `subphora sources list` prints it.
#
# Per service: kind is wms, wmts, wfs, wcs, ogc_api, rest or download; layers are the
# layers, feature types, coverages or collections of interest; web_mercator (wms, wmts and
# wfs only) says whether EPSG:3857 is offered; cors says whether a browser may call the
# service directly. Politeness is per service; services on one host share the strictest.
# A cache lifetime of 0 means never cache.

client:
  user_agent: "subphora/{version}"
  connect_timeout_s: 10
  read_timeout_s: 45
  # The Catastro hosts reset about one connection in three (docs/knowledge/catastro.md).
  retries: 2
  retry_backoff_s: 3
  max_response_bytes: 5000000
  # The Vite development server's origin, as the browser would send it.
  cors_probe_origin: "http://localhost:5173"

services:
  # ── Catastro (docs/knowledge/catastro.md) ─────────────────────────────────────────────
  - id: catastro-wms
    name: Cadastral parcels map (INSPIRE WMS)
    publisher: Dirección General del Catastro
    kind: wms
    base_url: https://ovc.catastro.meh.es/cartografia/INSPIRE/spadgcwms.aspx
    layers: [CP.CadastralParcel, CP.CadastralZoning, BU.Building]
    crs: [EPSG:3857, EPSG:4326, EPSG:4258, EPSG:25829, EPSG:25830, EPSG:25831, EPSG:3035]
    web_mercator: true
    cors: true
    licence: "Catastro licence for INSPIRE data and services: free; own use or transformed value-added products; no massive downloads and no tiled requests"
    attribution: "Dirección General del Catastro"
    terms_url: https://www.catastro.hacienda.gob.es/webinspire/documentos/Licencia.pdf
    knowledge: docs/knowledge/catastro.md
    politeness: {max_concurrent: 1, min_interval_s: 1.0, cache_lifetime_s: 604800}
    sample:
      description: one 256-pixel map of the parcels around the Antequera dolmens
      params: {SERVICE: WMS, VERSION: 1.3.0, REQUEST: GetMap, LAYERS: CP.CadastralParcel, STYLES: "", CRS: "EPSG:3857", BBOX: "-507000,4442000,-506000,4443000", WIDTH: "256", HEIGHT: "256", FORMAT: image/png, TRANSPARENT: "true"}
      expect_content_type: image/png

  - id: catastro-wfs-parcels
    name: Cadastral parcel geometry (INSPIRE WFS)
    publisher: Dirección General del Catastro
    kind: wfs
    base_url: https://ovc.catastro.meh.es/INSPIRE/wfsCP.aspx
    layers: [cp:CadastralParcel, cp:CadastralZoning]
    crs: [EPSG:4326, EPSG:4258, EPSG:25829, EPSG:25830, EPSG:25831, EPSG:3857, EPSG:3035]
    web_mercator: true
    cors: true
    licence: "Catastro licence for INSPIRE data and services: free; own use or transformed value-added products; no massive downloads"
    attribution: "Dirección General del Catastro"
    terms_url: https://www.catastro.hacienda.gob.es/webinspire/documentos/Licencia.pdf
    knowledge: docs/knowledge/catastro.md
    politeness: {max_concurrent: 1, min_interval_s: 1.0, cache_lifetime_s: 604800}
    sample:
      description: the public parcel of the Antequera dolmens by cadastral reference
      params: {service: WFS, version: 2.0.0, request: GetFeature, STOREDQUERY_ID: GetParcel, refcat: 2488901UF6928N, srsname: "EPSG::25830"}
      expect_content_type: text/xml
      expect_text: "2488901UF6928N"

  - id: catastro-ovc
    name: Non-protected cadastral data (OVC JSON services)
    publisher: Dirección General del Catastro
    kind: rest
    base_url: https://ovc.catastro.meh.es/OVCServWeb/OVCWcfCallejero
    cors: true
    licence: "Catastro free web services: non-protected data only (everything except owner and value)"
    attribution: "Dirección General del Catastro"
    terms_url: https://www.catastro.hacienda.gob.es/ws/Webservices_Libres.pdf
    knowledge: docs/knowledge/catastro.md
    politeness: {max_concurrent: 1, min_interval_s: 1.0, cache_lifetime_s: 604800}
    sample:
