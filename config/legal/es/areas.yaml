# Every river-basin district of Spain (the codes of MITECO's demarhidro_2027) with its
# groundwater authority and whether its basin plan's rules are loaded, and every region
# with whether its water law is (docs/knowledge/water-authorities.md, legal-groundwater.md).
# A district or region not fully loaded says what is missing and why. A region whose water
# law adds nothing to a well is loaded with no rules (legal-groundwater.md says which).

districts:
  ES010:
    name: "Miño-Sil"
    authority: "Confederación Hidrográfica del Miño-Sil"
    level: state
    plan: {state: loaded}
  ES014:
    name: "Galicia-Costa"
    authority: "Augas de Galicia (Xunta de Galicia)"
    level: regional
    plan:
      state: not_read
      reason:
        en: "The normative part of the Galicia-Costa plan (DOG no. 35, 20/02/2023) was read only up to its art. 31: the Xunta's servers refused the session's connection, and the copies that could be read end there, before art. 38 (distances between abstractions) and art. 40 (groundwater bodies). Session of 2026-11-26."
        es: "La parte normativa del plan de Galicia-Costa (DOG n.º 35, 20/02/2023) solo se pudo leer hasta su art. 31: los servidores de la Xunta rechazaron la conexión de la sesión y las copias legibles terminan ahí, antes del art. 38 (distancias entre aprovechamientos) y del art. 40 (masas de agua subterránea). Sesión del 2026-11-26."
  ES017:
    name: "Cantábrico Oriental"
    authority: "Confederación Hidrográfica del Cantábrico / URA (Agencia Vasca del Agua)"
    level: state
    note:
      en: "The State manages the inter-community basins of this district and URA, for the Basque Government, its internal basins; the point alone does not say which."
      es: "El Estado gestiona las cuencas intercomunitarias de esta demarcación y URA, por el Gobierno Vasco, sus cuencas internas; el punto por sí solo no dice cuál."
    plan: {state: loaded}
  ES018:
    name: "Cantábrico Occidental"
    authority: "Confederación Hidrográfica del Cantábrico"
    level: state
    plan: {state: loaded}
