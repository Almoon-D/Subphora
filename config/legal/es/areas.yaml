  ES110:
    name: "Illes Balears"
    authority: "Govern de les Illes Balears"
    level: regional
    plan: {state: loaded}
  ES120:
    name: "Gran Canaria"
    authority: "Consejo Insular de Aguas de Gran Canaria"
    level: regional
    plan:
      state: partial
      reason:
        en: "The island plan's small abstraction and concession are loaded; its protection space around existing galleries and wells is not evaluated: no layer maps them."
        es: "Del plan insular están cargados el pequeño aprovechamiento y la concesión; no se evalúa su espacio de protección alrededor de galerías y pozos existentes: ninguna capa los cartografía."
  ES122:
    name: "Fuerteventura"
    authority: "Consejo Insular de Aguas de Fuerteventura"
    level: regional
    plan:
      state: not_read
      reason:
        en: "The island plan approved by Decreto 139/2024 is published through a download service of the Gobierno de Canarias that the session did not reach; its normative text was not read (2026-11-26). The Canary Water Law's authorisation (ES-CN) applies."
        es: "El plan insular aprobado por el Decreto 139/2024 se publica en un servicio de descarga del Gobierno de Canarias al que la sesión no llegó; su texto normativo no se leyó (2026-11-26). Se aplica la autorización de la Ley de Aguas de Canarias (ES-CN)."
  ES123:
    name: "Lanzarote"
    authority: "Consejo Insular de Aguas de Lanzarote"
    level: regional
    plan:
      state: partial
      reason:
        en: "The island plan (Decreto 110/2024, BOC 155 of 2024) was searched for wells, distances between abstractions and the small-use volume, and none was found beyond the Canary Water Law; its coastal seawater-well conditions are not loaded, and its text was not reviewed in full (2026-11-26)."
        es: "Se buscaron en el plan insular (Decreto 110/2024, BOC 155 de 2024) pozos, distancias entre captaciones y el volumen del pequeño aprovechamiento, y no se halló nada más allá de la Ley de Aguas de Canarias; no se cargan sus condiciones para pozos costeros de agua de mar, y su texto no se revisó entero (2026-11-26)."
  ES124:
    name: "Tenerife"
    authority: "Consejo Insular de Aguas de Tenerife"
    level: regional
    plan:
      state: partial
      reason:
        en: "The island plan's small abstraction and concession are loaded; its protection space around existing galleries and wells is not evaluated: no layer maps them."
        es: "Del plan insular están cargados el pequeño aprovechamiento y la concesión; no se evalúa su espacio de protección alrededor de galerías y pozos existentes: ninguna capa los cartografía."
  ES125:
    name: "La Palma"
    authority: "Consejo Insular de Aguas de La Palma"
    level: regional
    plan:
      state: not_read
      reason:
        en: "The island plan approved by Decreto 6/2025 is published at the BOC as an image without a text layer, which the session could not read (2026-11-26). The Canary Water Law's authorisation (ES-CN) applies."
        es: "El plan insular aprobado por el Decreto 6/2025 está en el BOC como imagen sin capa de texto, que la sesión no pudo leer (2026-11-26). Se aplica la autorización de la Ley de Aguas de Canarias (ES-CN)."
  ES126:
    name: "La Gomera"
    authority: "Consejo Insular de Aguas de La Gomera"
    level: regional
    plan:
      state: not_read
      reason:
        en: "The BOC publication of Decreto 102/2023 that the session read holds the decree, not the plan's normative articles on wells (2026-11-26). The Canary Water Law's authorisation (ES-CN) applies."
        es: "La publicación en el BOC del Decreto 102/2023 que leyó la sesión contiene el decreto, no los artículos normativos del plan sobre pozos (2026-11-26). Se aplica la autorización de la Ley de Aguas de Canarias (ES-CN)."
  ES127:
    name: "El Hierro"
    authority: "Consejo Insular de Aguas de El Hierro"
    level: regional
    plan:
      state: partial
      reason:
        en: "The island plan (Decreto 86/2023, BOC 112 of 2023) was searched for wells, distances between abstractions and the small-use volume, and none was found beyond the Canary Water Law; its geothermal conditions are not loaded, and its text was not reviewed in full (2026-11-26)."
        es: "Se buscaron en el plan insular (Decreto 86/2023, BOC 112 de 2023) pozos, distancias entre captaciones y el volumen del pequeño aprovechamiento, y no se halló nada más allá de la Ley de Aguas de Canarias; no se cargan sus condiciones geotérmicas, y su texto no se revisó entero (2026-11-26)."
  ES150:
    name: "Ceuta"
    authority: "Confederación Hidrográfica del Guadalquivir"
    level: state
    plan: {state: loaded}
  ES160:
    name: "Melilla"
    authority: "Confederación Hidrográfica del Guadalquivir"
    level: state
    plan: {state: loaded}

