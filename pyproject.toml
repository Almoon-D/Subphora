[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "subphora"
version = "0.13.0"
description = "Groundwater likelihood map for any Spanish parcel: where to look, how deep, how sure, and whether drilling is allowed."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.15,<3.16"
authors = [{ name = "Almoon-D" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
# Runtime dependencies: a lower bound and the next major as the upper bound. A tighter
# bound gets a comment with its reason and an `ignore` in .github/dependabot.yml.
dependencies = [
    "fastapi>=0.165,<1",
    "httpx>=0.28.1,<1",
    "numpy>=2.5,<3",
    "openpyxl>=3.1.5,<4",
    "pillow>=13,<14",
    "pmtiles>=3.8.1,<4",
    "pydantic>=2.12,<3",
    "pyflwdir>=0.6,<1",
    "pyproj>=3.8,<4",
    "PyYAML>=6.0.3,<7",
    "rasterio>=1.5.2,<2",
    "scipy>=1.18,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
subphora = "subphora.__main__:main"

[dependency-groups]
dev = [
    "import-linter>=2.5",
    "mypy>=2.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "respx>=0.23.1",
    "ruff>=0.14",
    "types-openpyxl>=3.1.5.20261122",
    "types-PyYAML>=6.0.12",
]

# The notice every file carries (decision 0011); tests/unit/test_copyright.py enforces it.
[tool.subphora]
copyright_notice = "Copyright (c) 2026 Almoon-D. All rights reserved."

[tool.uv]
python-preference = "only-managed"

[tool.hatch.build.targets.wheel]
packages = ["src/subphora"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]
# The release workflow runs this script on its pinned runner's own Python 3.12.
per-file-target-version = { ".github/scripts/*.py" = "py312" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "PTH", "ARG", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["subphora", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Libraries without type information: their calls are wrapped in typed functions in geo/.
[[tool.mypy.overrides]]
module = ["rasterio.*", "pyflwdir.*", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Tests run in parallel on every core. A tiny suite pays ~1 s for it; a grown one saves
# a third or more (measured on a 340-file suite on a two-core runner).
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib", "-n", "auto"]
# `from tests.support import …` resolves from the repository root.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # rasterio's in-memory warp target is created before its transform is set; under the
    # build tests' thread pool its own catch_warnings (not thread-safe) lets this through.
    "ignore::rasterio.errors.NotGeoreferencedWarning",
]

[tool.coverage.run]
source = ["subphora"]
branch = true
# sys.monitoring: much lower overhead than the classic tracer.
core = "sysmon"

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
# Fixed, never lowered to fit a session's measurement. Start at 95 and raise it on purpose.
fail_under = 95

[tool.importlinter]
root_packages = ["subphora"]
include_external_packages = true

# Architecture rules as tests: the layers of docs/MASTER_PLAN.md §4.2. A higher layer may
# import a lower one, never the reverse; layers joined by `|` are independent siblings that
# never import each other. A new package gets its place here in the session that creates it.
[[tool.importlinter.contracts]]
name = "The layers of MASTER_PLAN §4.2"
type = "layers"
containers = ["subphora"]
layers = [
    "__main__",
    "api",
    "services",
    "model | legal",
    "countries | geo | sources | store",
    "config",
    "domain",
]

# Only sources/ talks to the network (hard rule 4: one client, catalogued hosts only).
[[tool.importlinter.contracts]]
name = "Only the sources layer imports an HTTP client"
type = "forbidden"
source_modules = [
    "subphora.domain",
    "subphora.config",
    "subphora.countries",
    "subphora.geo",
    "subphora.model",
    "subphora.store",
    "subphora.services",
    "subphora.api",
    "subphora.__main__",
]
forbidden_modules = ["httpx", "httpcore", "http"]
allow_indirect_imports = true

# The model receives grids and never fetches or stores them (MASTER_PLAN §4.2), so it is
# tested on synthetic grids without network.
[[tool.importlinter.contracts]]
name = "The model imports only domain, config and geo"
type = "forbidden"
source_modules = ["subphora.model"]
forbidden_modules = ["subphora.sources", "subphora.store", "subphora.countries"]

# The legal filter evaluates rules held as data on what it is handed (MASTER_PLAN §4.2,
# §4.5), so every rule's branches are tested without network or grids.
[[tool.importlinter.contracts]]
name = "The legal filter imports only domain and config"
type = "forbidden"
source_modules = ["subphora.legal"]
forbidden_modules = [
    "subphora.sources",
    "subphora.store",
    "subphora.countries",
    "subphora.geo",
    "subphora.model",
]
